positive_natural: >-
  A still frame from a late-1980s / early-1990s Japanese hand-drawn anime film: cel-painted
  figures with slightly rough dark ink outlines and hard-edged flat shadow shapes, over a
  hand-painted gouache background with visible brush texture. Low-key, dim, moody light. The
  whole frame is color graded into ONE dominant muted hue (deep forest green, dark teal, or navy
  blue) with a single warm accent of rust orange or burnt red light. Desaturated, faded, low
  contrast, lifted milky blacks, like a worn 35mm anime print with visible film grain. Quiet,
  intimate, nostalgic, romantic. Not bright, not pastel, no smooth digital gradients, no glow,
  not photorealistic, no 3D, no text.
