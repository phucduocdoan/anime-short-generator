workspace_dir: workspace

llm:
  base_url: http://localhost:8093/v1
  model: qwen3-vl-8b
  api_key_env: LLM_API_KEY
  temperature: 0.8
  max_retries: 3
  timeout_seconds: 180

script:
  words_per_second: 4.2       # measured VieNeu Vietnamese pace (~4.0-4.6 w/s per scene)
  hook_seconds: 3
  max_shots_per_scene: 3

tts:
  provider: vieneu
  elevenlabs:
    model_id: eleven_v3
    voice_id: null
    output_format: mp3_44100_128
  gemini:
    model: gemini-3.8-flash-tts   # Google API; needs GEMINI_API_KEY; no word timestamps
  vieneu:
    voice: null
    device: cuda

timeline:
  scene_gap_seconds: 0.15
  min_shot_seconds: 1.5
  max_shot_seconds: 5.0
  tail_seconds: 0.5

image:
  provider: zanime
  width: 864
  height: 1536
  providers:
    anima:
      repo: vladmandic/Anima-1.0-Turbo   # community Diffusers conversion of Anima Turbo
      prompt_style: tags
      steps: 10
      cfg: 1.0
    netayume:
      repo: duongve/NetaYume-Lumina-Image-2.0-Diffusers-v40
      prompt_style: tags
      steps: 40
      cfg: 5.0
    zanime:
      repo: SeeSee21/Z-Anime
      transformer_file: diffusion_models/z-anime-distill-8step-bf16.safetensors
      prompt_style: natural
      steps: 8
      cfg: 1.0
    gemini:
      model: gemini-3-pro-image   # Google API; needs GEMINI_API_KEY, ~25 s/img
      image_size: 2K              # API output size; the result is resized to width x height
      api_key_env: GEMINI_API_KEY

video:
  provider: animegen          # falls back to still_motion when VRAM gate fails
  animegen:
    repo: aidealab/AnimeGen-I2V
    width: 480
    height: 832
    steps: 4
    cfg: 1.0
    native_fps: 16
    max_frames: 81
    min_free_vram_gb: 24        # measured peak ~20.9GB reserved at 480x832/81 frames (5s, worst case); +margin
  still_motion:
    oversample: 1.4           # keyframe is upscaled to this multiple of the output size before the
                              # float crops are resampled; framing does not depend on it (zoom 1 = whole image)
    grain: 0.03
    vignette: 0.15

subtitle:
  enabled: true
  style: shorts
  font_name: Be Vietnam Pro
  max_words: 5
  max_chars: 28

render:
  crf: 18
  audio_bitrate: 192k
  loudness_lufs: -14
  true_peak_db: -1
  fade_seconds: 0.3
  film_grain: 0      # moving film grain strength (0 = off; quotes videos use ~14)
  vignette: false
  dust: 0            # old-film black dust specks per frame on average (0 = off; quotes use ~8)

music:
  enabled: false
  path: null
  provider: null  # library: pick a track from `library` per project; acestep: generate one
  library: assets/music/piano  # downloaded free tracks (YouTube Audio Library, Pixabay, CC0...)
  volume_db: -22
  duck: true  # false: music stays at volume_db, also while the voice speaks
  acestep:
    base_url: http://127.0.0.1:8001
    prompt: >-
      lo-fi instrumental, soft felt piano, warm vinyl crackle, slow, tender, romantic,
      nostalgic, no drums, no percussion
    bpm: 70
    key_scale: ""

gpu:
  device: cuda
