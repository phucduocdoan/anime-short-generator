[project]
name = "anime-short"
version = "0.1.0"
description = "Topic -> vertical anime Short (script, TTS, T2I, I2V, FFmpeg)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "openai>=1.40",
    "python-dotenv>=1",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.5",
    "diffusers>=0.40",
    "transformers>=4.51",
    "accelerate>=1",
    "peft>=0.13",
    "sentencepiece",
    "protobuf",
    "safetensors",
    "huggingface_hub>=0.34",
    "ftfy",
]

[project.scripts]
anime-short = "anime_short.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_short"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU and model weights",
    "network: needs network / API keys",
]
addopts = "-m 'not gpu and not network'"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
